<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квіз «Волосся після 35»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Layout: festive winter evening — deep coral backdrop with slow snow, cream cards, gold hairline ornaments */
:root{
  color-scheme:light;
  --coral:#7D2826; --wine:#4f1517; --cream:#f7efe6; --candle:#EFE9D7; --blush:#efd5d0; --gold:#c39a5c;
  --ink:#2a1414; --muted:#7a5f5a; --line:#e6d6cb;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#953235 0%,var(--coral) 40%,var(--wine) 100%) fixed;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
html{background:var(--wine)}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;justify-content:space-between;align-items:baseline;color:var(--candle)}
.brand b{font-family:var(--serif);font-style:italic;font-size:20px;font-weight:500}
.brand span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.card{background:var(--cream);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 70px -40px rgba(0,0,0,.6);position:relative}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(195,154,92,.45);border-radius:22px;pointer-events:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;line-height:1.05;text-wrap:balance;color:var(--coral)}
h1{font-size:clamp(36px,10vw,52px)}
h1 em,h2 em{font-style:italic;font-weight:500;color:var(--ink)}
h2{font-size:clamp(26px,7vw,34px)}
h3{font-size:26px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:10px}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:22px;background:var(--gold)}
.lead{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted);line-height:1.35}
.fact b{display:block;font-family:var(--serif);font-size:26px;color:var(--coral);font-weight:600;line-height:1.1}
.btn{appearance:none;border:0;border-radius:999px;background:var(--coral);color:var(--cream);font:700 16px/1 var(--sans);padding:18px 24px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn:hover{background:var(--wine)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--coral);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.expert{font-size:13px;color:var(--muted);text-align:center}
/* progress */
.prog{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prog .bar{flex:1;height:2px;background:var(--line);position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.prog .bar i::after{content:"❄";position:absolute;right:-7px;top:-9px;font-size:14px;color:var(--gold);font-style:normal}
.q{font-size:clamp(25px,6.8vw,32px)}
.hint{font-size:14px;color:var(--muted);margin-top:-8px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fffaf5;color:var(--ink);border-radius:16px;padding:14px 16px;font:500 15px/1.4 var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt .mark{flex:none;width:20px;height:20px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"]{background:var(--blush);border-color:var(--coral)}
.opt[aria-pressed="true"] .mark{background:var(--coral);border-color:var(--coral)}
.opt[aria-pressed="true"] .mark::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 auto}
/* result */
.meter{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px 10px;align-items:center;font-size:14px;font-weight:600}
.mrow .track{grid-column:1/-1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.mrow .track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--coral))}
.mrow span:nth-child(2){text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.profile{background:#fffaf5;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.profile b{color:var(--coral)}
.checks{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.note{background:var(--blush);border-radius:16px;padding:14px 16px;font-size:14px}
.fine-print{font-size:12px;color:var(--muted)}
/* offer */
.offer{background:linear-gradient(160deg,var(--coral),var(--wine));color:var(--cream);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.offer::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 22px);opacity:.8}
.offer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:4px}
.ny{background:var(--cream);color:var(--coral);font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.cd{color:rgba(247,239,230,.8)}
.offer h3{color:var(--cream);font-style:italic;font-weight:500}
.offer-line{color:rgba(247,239,230,.85)}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price strong{font-family:var(--serif);font-size:68px;line-height:.9;font-weight:700}
.price s{opacity:.6;font-size:20px}
.save{background:var(--gold);color:var(--wine);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
.incl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.incl li{display:flex;gap:10px}.incl li::before{content:"✦";color:var(--gold)}
.offer .btn{background:var(--cream);color:var(--coral)}
.offer .btn:hover{background:#fff}
.fine{font-size:12px;color:rgba(247,239,230,.7);text-align:center}
.foot{font-size:12px;color:rgba(247,239,230,.75);text-align:center;padding:0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#snow{display:none}}

<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="brand"><b>Оля Євміна</b><span>дієтолог-трихолог</span></div>
  <main class="card" id="app" aria-live="polite"></main>
  <p class="foot">Тест не є діагнозом і не замінює консультацію лікаря.</p>
</div>
<script>

/* === Налаштування (міняти тут) === */
const CHECKOUT_URL = "https://buy.stripe.com/eVq00k2hW69seEr07f8EM0u"; // посилання Stripe на $11 (повертає на thankyou-superpage)
const PRICE = 11, OLD_PRICE = 60, CURRENCY = "USD";
const DEADLINE = "2026-12-31T23:59:59";  // кінець новорічної знижки
/* ================================= */

const app=document.getElementById("app");
const fired=new Set();
function px(type,name,params){ if(fired.has(name)) return; fired.add(name); try{ if(window.fbq) fbq(type,name,params||{}); }catch(e){} }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function focusTitle(){ const h=app.querySelector("h1,h2"); if(h){ h.setAttribute("tabindex","-1"); try{h.focus({preventScroll:true});}catch(e){} } window.scrollTo(0,0); }
function offerHTML(line){
  return `<section class="offer">
    <div class="offer-top"><span class="ny">❄ Знижка до Нового року</span><span class="cd" id="cd"></span></div>
    <h3>Інтенсив «Розкішне волосся»</h3>
    <p class="offer-line">${line}</p>
    <div class="price"><strong>$${PRICE}</strong><s>$${OLD_PRICE}</s><span class="save">−${Math.round((1-PRICE/OLD_PRICE)*100)}%</span></div>
    <ul class="incl">
      <li>7 відеоуроків у Telegram-боті</li>
      <li>Які аналізи здати і як їх читати</li>
      <li>План харчування, рецепти, смузі, суперфуди</li>
      <li>Як читати склади косметики</li>
      <li>Безкоштовний додаток: розшифруйте аналізи за кілька хвилин</li>
      <li>Доступ до матеріалів 90 днів</li>
    </ul>
    <a class="btn buy" id="buy" href="${CHECKOUT_URL}">Забрати за $${PRICE}</a>
    <p class="fine">Після оплати уроки приходять у Telegram-бот · 14 днів гарантії повернення коштів, якщо інтенсив не сподобається</p>
  </section>`;
}
function startCountdown(){
  const el=document.getElementById("cd"); if(!el) return; const end=new Date(DEADLINE).getTime();
  function tick(){ let s=Math.max(0,Math.floor((end-Date.now())/1000)); const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); const m=Math.floor(s%3600/60);
    el.textContent= end<=Date.now() ? "Знижка завершилась" : `ще ${d} ${plural(d,"день","дні","днів")} ${h} год ${m} хв`; }
  tick(); setInterval(tick,30000);
}
function bindBuy(category,profile){
  const a=document.getElementById("buy"); if(!a) return;
  const url=CHECKOUT_URL+(CHECKOUT_URL.indexOf("?")<0?"?":"&")+"utm_source="+category+"&utm_content="+encodeURIComponent(profile)+"&client_reference_id="+category+"_"+encodeURIComponent(profile);
  a.href=url;
  a.addEventListener("click",function(e){ e.preventDefault();
    try{ if(window.fbq) fbq("track","InitiateCheckout",{value:PRICE,currency:CURRENCY,content_name:"Інтенсив «Розкішне волосся»",content_category:category,num_items:1,profile:profile}); }catch(err){}
    setTimeout(function(){ window.location.href=url; },350); });
  startCountdown();
}

const P="QH", CATEGORY="quiz_35plus";
const Q=[
 {t:"Скільки <em>вам років?</em>",o:[
   {t:"35–39",w:{def:1}},{t:"40–44",w:{horm:1,def:1}},{t:"45–49",w:{horm:2}},{t:"50+",w:{horm:2}}]},
 {t:"Що зараз <em>з циклом?</em>",o:[
   {t:"Регулярний, як завжди",w:{def:1}},
   {t:"Став нерегулярним, коротшим або ряснішим",w:{horm:2,def:1}},
   {t:"Менопауза",w:{horm:3}},
   {t:"Пологи або ГВ за останні 1,5 року",w:{def:2,horm:1}}]},
 {t:"Як змінилося <em>волосся?</em>",hint:"Можна обрати кілька",multi:true,o:[
   {t:"Розширюється проділ, рідшає маківка",w:{horm:2}},
   {t:"Випадає рівномірно, жменями після миття",w:{def:2}},
   {t:"Стало сухим, тонким і ламким",w:{horm:1,def:1}},
   {t:"Менше густоти на скронях",w:{horm:1}}]},
 {t:"Що ще <em>помічаєте?</em>",hint:"Можна обрати кілька",multi:true,o:[
   {t:"Приливи або нічна пітливість",w:{horm:2}},
   {t:"Гірший сон, дратівливість",w:{horm:1}},
   {t:"Втома, мерзнуть руки й ноги",w:{def:2},f:["thycheck"]},
   {t:"Ламкі нігті, бліда шкіра",w:{def:2}},
   {t:"Вага почала збиратися на животі",w:{horm:1}},
   {t:"Нічого з цього",w:{},x:true}]},
 {t:"Щитовидна <em>залоза</em>",o:[
   {t:"Є діагноз: гіпотиреоз, АІТ чи гіпертиреоз",w:{horm:1},f:["thy"]},
   {t:"Давно не перевіряла",w:{},f:["thycheck"]},
   {t:"Перевіряла нещодавно, все добре",w:{}}]},
 {t:"Як ви <em>харчуєтесь?</em>",o:[
   {t:"Білок щодня: м'ясо, риба, яйця",w:{}},
   {t:"М'ясо рідко або я вегетаріанка",w:{def:2}},
   {t:"Часто дієти, пропускаю прийоми їжі",w:{def:2}},
   {t:"Багато кави й солодкого",w:{def:1}}]},
 {t:"Чи був сильний стрес <em>за останні 3–6 місяців?</em>",o:[
   {t:"Так, стрес, хвороба чи втрата",w:{def:1},f:["stress"]},
   {t:"Ні, нічого особливого",w:{}}]},
 {t:"Що вже <em>пробували?</em>",hint:"Можна обрати кілька",multi:true,o:[
   {t:"Шампуні, маски, сироватки",w:{}},
   {t:"Вітаміни «для волосся», біотин",w:{},f:["biotin"]},
   {t:"Гормональну терапію чи контрацептиви",w:{horm:1}},
   {t:"Ще нічого",w:{},x:true}]}
];
const R={
  horm:{name:"Гормональний перехід",what:"Після 35 рівень естрогенів поступово знижується, і волосся відчуває це першим: стає тоншим, сухішим, повільніше росте, а проділ здається ширшим. Це природний процес, але його можна підтримати харчуванням, доглядом і перевіркою, чи не накладається на нього ще й дефіцит.",
    check:["ТТГ і вільний Т4","Феритин","Вітамін D","Статеві гормони — обговорити з гінекологом"]},
  def:{name:"Дефіцитне випадіння",what:"Після 35 запаси заліза, вітаміну D і B12 часто виснажені: пологи, рясні місячні, дієти, стрес. Волосся отримує поживні речовини в останню чергу, тому реагує першим, навіть коли загальні аналізи «в нормі».",
    check:["Загальний аналіз крові","Феритин","Вітамін D","Вітамін B12","Цинк"]},
  mix:{name:"Гормони + дефіцит",what:"Часто після 35 причин дві одночасно: гормональні зміни роблять фолікули чутливішими, а дефіцит забирає ресурс для росту. Тому один засіб і не допомагає: потрібно закрити обидві сторони.",
    check:["Феритин і загальний аналіз крові","Вітамін D і B12","ТТГ і вільний Т4","Статеві гормони — обговорити з гінекологом"]}
};
function progressHTML(s,n){ return `<div class="prog"><span>${s+1} / ${n}</span><div class="bar"><i style="width:${Math.max(4,(s+1)/n*100)}%"></i></div></div>`; }
function intro(){
  app.innerHTML=`<span class="eyebrow">Квіз для жінок 35+</span>
  <h1>Волосся після 35: <em>гормони чи дефіцит?</em></h1>
  <p class="lead">8 питань, щоб зрозуміти, що найімовірніше стоїть за змінами вашого волосся і з чого почати.</p>
  <div class="facts"><div class="fact"><b>8</b>питань</div><div class="fact"><b>2</b>хвилини</div><div class="fact"><b>1</b>ваш профіль</div></div>
  <button class="btn" id="go" type="button">Пройти тест</button>
  <p class="expert">Квіз складено за методикою Олі Євміної, дієтолога-трихолога з вищою європейською медичною освітою.</p>`;
  document.getElementById("go").onclick=()=>{ px("trackCustom",P+"_Start"); step=0; render(); };
}
function showResult(){
  const {w,flags}=collect(); const h=w.horm||0, d=w.def||0; const tot=Math.max(1,h+d);
  const ph=Math.round(h/tot*100), pd=100-ph;
  const key=Math.abs(ph-pd)<=20?"mix":(h>d?"horm":"def"); const r=R[key];
  px("trackCustom",P+"_Result",{profile:key});
  const notes=[];
  if(flags.has("thy")) notes.push("Ви згадали щитовидку. Коли гормони щитовидки не в балансі, догляд дає лише короткий ефект, тому її варто контролювати разом з іншими показниками.");
  else if(flags.has("thycheck")) notes.push("Втома й мерзлякуватість можуть бути пов'язані і з дефіцитом, і зі щитовидкою. ТТГ варто перевірити в будь-якому разі.");
  if(flags.has("stress")) notes.push("Стрес чи хвороба за останні місяці можуть посилювати випадіння із запізненням у 2–3 місяці.");
  if(flags.has("biotin")) notes.push("Великі дози біотину спотворюють результати деяких аналізів. Перед здачею крові його зазвичай припиняють за кілька днів, уточніть це з лікарем.");
  app.innerHTML=`<span class="eyebrow">Ваш профіль</span>
  <h2>${r.name}</h2>
  <div class="meter">
    <div class="mrow"><span>Гормональні зміни</span><span>${ph}%</span><div class="track"><i style="width:${ph}%"></i></div></div>
    <div class="mrow"><span>Дефіцити</span><span>${pd}%</span><div class="track"><i style="width:${pd}%"></i></div></div>
  </div>
  <div class="profile"><p>${r.what}</p><div><b>Що варто перевірити:</b><ul class="checks">${r.check.map(c=>`<li>${c}</li>`).join("")}</ul></div></div>
  ${notes.map(n=>`<p class="note">${n}</p>`).join("")}
  ${offerHTML("Почніть новий рік із розуміння, що відбувається з вашим волоссям: 7 уроків від Олі Євміної.")}
  <button class="btn ghost" id="again" type="button">Пройти ще раз</button>
  <p class="fine-print">Результат має освітній характер і не є діагнозом. Аналізи призначає і трактує лікар.</p>`;
  bindBuy(CATEGORY,key);
  document.getElementById("again").onclick=()=>{ ans.forEach(a=>a.clear()); step=-1; render(); };
}
// сніг
(function(){ const c=document.getElementById("snow"); if(!c||!c.getContext) return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x=c.getContext("2d"); let W,H,F=[];
  function size(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; }
  size(); addEventListener("resize",size);
  for(let i=0;i<70;i++) F.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.6,s:Math.random()*.0008+.0004,d:Math.random()*Math.PI*2});
  (function loop(){ x.clearRect(0,0,W,H); x.fillStyle="rgba(255,245,238,.75)";
    F.forEach(f=>{ f.y+=f.s; f.d+=.01; f.x+=Math.sin(f.d)*.0004; if(f.y>1.02){f.y=-.02;f.x=Math.random();}
      x.beginPath(); x.arc(f.x*W,f.y*H,f.r*devicePixelRatio,0,Math.PI*2); x.fill(); });
    requestAnimationFrame(loop); })();
})();

let step=-1; const ans=Q.map(()=>new Set());
function render(){ if(step<0) intro(); else if(step>=Q.length) showResult(); else question(); focusTitle(); }
function question(){
  const q=Q[step], sel=ans[step];
  px("trackCustom",P+"_Q"+(step+1),{question:step+1});
  app.innerHTML=`${progressHTML(step,Q.length)}
  <h2 class="q">${q.t}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:""}
  <div class="opts">${q.o.map((o,i)=>`<button type="button" id="o${step}_${i}" class="opt ${q.multi?"multi":""}" aria-pressed="${sel.has(i)}" data-i="${i}"><span class="mark" aria-hidden="true"></span><span>${o.t}</span></button>`).join("")}</div>
  <div class="nav"><button type="button" class="btn ghost" id="back">Назад</button><button type="button" class="btn" id="next" ${sel.size?"":"disabled"}>Далі</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(q.multi){
      if(sel.has(i)) sel.delete(i); else { if(q.o[i].x) sel.clear(); else q.o.forEach((o,j)=>{ if(o.x) sel.delete(j); }); sel.add(i); }
    } else { sel.clear(); sel.add(i); }
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",sel.has(+x.dataset.i)));
    document.getElementById("next").disabled=!sel.size;
  });
  document.getElementById("back").onclick=()=>{ step--; render(); };
  document.getElementById("next").onclick=()=>{ if(sel.size){ step++; render(); } };
}
function collect(){
  const w={}, flags=new Set();
  Q.forEach((q,qi)=>ans[qi].forEach(i=>{ const o=q.o[i]; for(const k in (o.w||{})) w[k]=(w[k]||0)+o.w[k]; (o.f||[]).forEach(f=>flags.add(f)); }));
  return {w,flags};
}
render();

</script>
